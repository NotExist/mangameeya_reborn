name: Bench

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  spike:
    name: Phase 1 CPU spike
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Prepare fixture
        env:
          # Set `BENCH_FIXTURE_URL` as a repo variable (Settings →
          # Secrets and variables → Actions → Variables) to point at a real
          # manga-shaped zip hosted outside the repo. Falls back to the
          # synthetic fixture if unset.
          BENCH_FIXTURE_URL: ${{ vars.BENCH_FIXTURE_URL }}
        run: |
          mkdir -p bench-data
          if [ -n "$BENCH_FIXTURE_URL" ]; then
            echo "Fetching fixture from \$BENCH_FIXTURE_URL"
            curl -fsSL --retry 3 "$BENCH_FIXTURE_URL" -o bench-data/fixture.zip
          else
            echo "BENCH_FIXTURE_URL not set, falling back to synthetic fixture"
            cargo run --release --bin gen_fixture -- bench-data/fixture.zip 220 30
          fi
          ls -lh bench-data/fixture.zip

      - name: Run spike
        run: |
          cargo run --release --bin spike -- bench-data/fixture.zip \
            | tee bench-data/metrics.json
          echo "----- summary -----"
          cat bench-data/metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: spike-metrics
          path: bench-data/metrics.json
          retention-days: 90

  micro:
    name: Criterion micro benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run criterion benches
        run: cargo bench --bench pipeline -- --output-format bencher | tee bench-data-out.txt
        continue-on-error: false

      - name: Upload bencher summary
        uses: actions/upload-artifact@v4
        with:
          name: criterion-bencher-summary
          path: bench-data-out.txt
          retention-days: 90

      - name: Upload criterion HTML report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-html-report
          path: target/criterion/
          retention-days: 30
