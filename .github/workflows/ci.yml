name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features all-spikes -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features all-spikes

  build-spikes:
    name: Build spikes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux runners need X11/Wayland headers for winit / iced to *link*.
      # (We only build, we do not run.)
      - name: Install Linux GUI headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev \
                                  libxcb1-dev libxcb-icccm4-dev libxcb-image0-dev \
                                  libxcb-keysyms1-dev libxcb-shape0-dev libxcb-randr0-dev \
                                  libxcb-render-util0-dev libxcb-xinerama0-dev \
                                  libxcb-cursor-dev libgl1-mesa-dev
      - name: Build spike_gpu
        run: cargo build --release --features gpu-spike --bin spike_gpu
      - name: Build spike_iced
        run: cargo build --release --features iced-spike --bin spike_iced
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: spikes-${{ matrix.os }}
          path: |
            target/release/spike_gpu*
            target/release/spike_iced*
          if-no-files-found: warn
          retention-days: 14
