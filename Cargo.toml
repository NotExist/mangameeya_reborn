[package]
name = "mangameeya_reborn"
version = "0.1.0"
edition = "2024"
description = "Modern Rust rewrite of MangaMeeya — Phase 1 disposable CPU spike"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
