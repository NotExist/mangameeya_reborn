[package]
name = "hamana_reborn"
version = "0.1.0"
edition = "2024"
description = "Hamana-style image/manga viewer in Rust (with mangameeya-inspired archive support and keyboard ergonomics)"
publish = false

[features]
default = []
gpu-spike = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
iced-spike = ["dep:iced"]
software-spike = ["dep:winit", "dep:softbuffer"]
# Meta-feature for legacy Windows (Win7) build. Currently identical to
# software-spike; reserved for future legacy-only branches (font fallback,
# Win32 conditional code, etc.).
legacy-windows = ["software-spike"]
all-spikes = ["gpu-spike", "iced-spike", "software-spike"]

[dependencies]
anyhow = "1"
fast_image_resize = { version = "5", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"

# Phase 1b GPU spike
winit = { version = "0.30", optional = true }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

# Phase 2 Iced spike
iced = { version = "0.14", optional = true, features = ["image", "advanced"] }

# Phase 1b/5 software-renderer spike (legacy Windows-friendly)
softbuffer = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[[bin]]
name = "spike_gpu"
required-features = ["gpu-spike"]

[[bin]]
name = "spike_iced"
required-features = ["iced-spike"]

[[bin]]
name = "spike_software"
required-features = ["software-spike"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
